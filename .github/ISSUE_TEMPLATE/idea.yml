name: Idea or translation
description: Suggest a fictional room, quest, story or wording improvement.
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: "This Issue is public: anyone can read it. Use fictional examples only. No contacts, school names, account data, production logs or keys. Report security issues privately using SECURITY.md."
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: A small improvement you would like to make.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What would change?
      description: Describe the intended outcome; code is optional.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included personal data, private screenshots or credentials.
          required: true

name: Community PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-community:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Require reviewed standalone lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::Generate and review the standalone package-lock.json before enabling PR validation."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Check public commit identities
        run: node scripts/check-public-authors.mjs
      - name: Scan complete history for credentials
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks-8.30.1.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/community-gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/community-gitleaks" gitleaks
          "$RUNNER_TEMP/community-gitleaks/gitleaks" git --redact --no-banner --no-color --log-opts=--all .
      - run: npm audit --ignore-scripts --audit-level=moderate
      - run: npm run check:boundary
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
    <title>Kibou Community Village - Offline Demo</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <header><div><strong>KIBOU COMMUNITY</strong><span>Fictional village / local demo</span></div><button id="reset" type="button">Reset demo</button></header>
    <main>
      <section class="world" aria-label="Village map">
        <canvas id="village" tabindex="0" aria-label="Fictional village map. Places are also available in the navigation below."></canvas>
        <div class="world-caption"><h1>A little place to make things.</h1><p id="progress">0 / 3 village quests</p></div>
      </section>
      <aside id="panel" hidden aria-labelledby="panel-title"><div class="panel-header"><h2 id="panel-title"></h2><button id="close" type="button" aria-label="Close panel">Close</button></div><div id="panel-content"></div></aside>
    </main>
    <div class="feedback">
      <p id="status" role="status" aria-live="polite"></p>
      <p id="storage-status" role="status" aria-live="polite"></p>
    </div>
    <nav aria-label="Village navigation"><button type="button" id="board">Noticeboard</button><button type="button" id="host">Host</button><button type="button" id="applications">My applications</button><button class="primary" type="button" id="next">Next step</button></nav>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
